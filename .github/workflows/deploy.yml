name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy via rsync over SSH
        run: |
          sshpass -p "$SSH_PASSWORD" rsync -avzr --delete \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" \
            out/ \
            $SSH_USERNAME@$SSH_HOST:~/public_html/
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Clear Hostinger LiteSpeed cache
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -p $SSH_PORT -o StrictHostKeyChecking=no \
            $SSH_USERNAME@$SSH_HOST \
            'find ~/public_html -name "*.html" -exec touch -m {} \; && echo "Cache invalidated"'
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
