<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">

  <!-- Background -->
  <rect width="400" height="480" fill="#FAF5E4"/>

  <!-- ═══════════════════════════════
       SHIELD
  ═══════════════════════════════ -->
  <!-- Outer shield fill -->
  <path d="
    M 200,44
    C 240,44 290,58 320,80
    C 345,100 348,132 348,168
    C 348,230 320,290 280,328
    C 256,350 228,364 200,372
    C 172,364 144,350 120,328
    C 80,290 52,230 52,168
    C 52,132 55,100 80,80
    C 110,58 160,44 200,44 Z
  " fill="#2A3D2C"/>

  <!-- Inner border line -->
  <path d="
    M 200,60
    C 236,60 282,72 308,92
    C 330,110 332,138 332,168
    C 332,224 307,279 270,314
    C 248,334 224,347 200,354
    C 176,347 152,334 130,314
    C 93,279 68,224 68,168
    C 68,138 70,110 92,92
    C 118,72 164,60 200,60 Z
  " fill="none" stroke="#D4C4A0" stroke-width="1.5" opacity="0.5"/>

  <!-- ═══════════════════════════════
       EAGLE HEAD — facing right
       Heraldic, geometric silhouette
  ═══════════════════════════════ -->
  <path d="
    M 177,136
    C 184,126 200,122 218,128
    C 232,133 244,144 252,158
    C 258,168 260,178 257,188
    C 254,196 247,200 240,198
    C 234,196 229,190 226,183
    C 219,194 210,208 204,222
    C 198,236 194,252 190,262
    C 185,270 175,270 168,262
    C 161,250 160,232 162,214
    C 164,196 166,176 168,160
    C 170,148 173,139 177,136 Z
  " fill="#D4C4A0"/>

  <!-- Beak hook detail -->
  <path d="
    M 240,198
    C 246,200 254,198 258,190
    C 262,182 260,170 255,160
  " fill="none" stroke="#D4C4A0" stroke-width="0" opacity="0"/>

  <!-- Eye -->
  <circle cx="218" cy="148" r="6" fill="#FAF5E4"/>
  <circle cx="218" cy="148" r="3" fill="#2A3D2C"/>
  <circle cx="219.5" cy="146.5" r="1" fill="#FAF5E4"/>

  <!-- ═══════════════════════════════
       LAUREL BRANCHES — perfectly symmetric
       Built on right, mirrored for left
  ═══════════════════════════════ -->

  <!-- RIGHT branch — curves up-right from center-bottom of shield -->
  <g fill="#2A3D2C">
    <!-- Stem line -->
    <path d="M 210,378 C 232,365 258,345 278,318 C 295,295 306,270 312,248"
          fill="none" stroke="#2A3D2C" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Leaves along stem, alternating sides -->
    <ellipse cx="228" cy="368" rx="11" ry="4.5" transform="rotate(-30 228 368)"/>
    <ellipse cx="232" cy="358" rx="10" ry="4"   transform="rotate(-20 232 358)"/>
    <ellipse cx="244" cy="350" rx="11" ry="4.5" transform="rotate(-42 244 350)"/>
    <ellipse cx="250" cy="339" rx="10" ry="4"   transform="rotate(-32 250 339)"/>
    <ellipse cx="260" cy="330" rx="11" ry="4.5" transform="rotate(-55 260 330)"/>
    <ellipse cx="267" cy="317" rx="10" ry="4"   transform="rotate(-44 267 317)"/>
    <ellipse cx="276" cy="306" rx="10" ry="4.5" transform="rotate(-65 276 306)"/>
    <ellipse cx="284" cy="291" rx="9"  ry="3.8" transform="rotate(-57 284 291)"/>
    <ellipse cx="292" cy="276" rx="9"  ry="3.8" transform="rotate(-72 292 276)"/>
    <ellipse cx="298" cy="260" rx="8"  ry="3.5" transform="rotate(-68 298 260)"/>
  </g>

  <!-- LEFT branch — exact mirror of right -->
  <g fill="#2A3D2C" transform="translate(400,0) scale(-1,1)">
    <path d="M 210,378 C 232,365 258,345 278,318 C 295,295 306,270 312,248"
          fill="none" stroke="#2A3D2C" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="228" cy="368" rx="11" ry="4.5" transform="rotate(-30 228 368)"/>
    <ellipse cx="232" cy="358" rx="10" ry="4"   transform="rotate(-20 232 358)"/>
    <ellipse cx="244" cy="350" rx="11" ry="4.5" transform="rotate(-42 244 350)"/>
    <ellipse cx="250" cy="339" rx="10" ry="4"   transform="rotate(-32 250 339)"/>
    <ellipse cx="260" cy="330" rx="11" ry="4.5" transform="rotate(-55 260 330)"/>
    <ellipse cx="267" cy="317" rx="10" ry="4"   transform="rotate(-44 267 317)"/>
    <ellipse cx="276" cy="306" rx="10" ry="4.5" transform="rotate(-65 276 306)"/>
    <ellipse cx="284" cy="291" rx="9"  ry="3.8" transform="rotate(-57 284 291)"/>
    <ellipse cx="292" cy="276" rx="9"  ry="3.8" transform="rotate(-72 292 276)"/>
    <ellipse cx="298" cy="260" rx="8"  ry="3.5" transform="rotate(-68 298 260)"/>
  </g>

  <!-- ═══════════════════════════════
       BANNER RIBBON
  ═══════════════════════════════ -->
  <!-- Main ribbon body -->
  <path d="
    M 72,410
    C 100,398 148,392 200,394
    C 252,392 300,398 328,410
    C 300,422 252,428 200,426
    C 148,428 100,422 72,410 Z
  " fill="#2A3D2C"/>

  <!-- Left tail fold -->
  <path d="M 72,410 L 54,422 L 72,416 Z" fill="#1A2A1C"/>
  <!-- Right tail fold -->
  <path d="M 328,410 L 346,422 L 328,416 Z" fill="#1A2A1C"/>

  <!-- Banner text -->
  <text
    x="200"
    y="414"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="12.5"
    letter-spacing="3.5"
    fill="#D4C4A0"
    text-anchor="middle"
    dominant-baseline="middle"
    font-weight="bold">FIDELIS STRATEGY</text>

</svg>
